name: SetupShop Continuous Integration

on: [ push, pull_request ]

jobs:
    build:

        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: '21'
            -   run: java --version
            -   run: ./mvnw test
