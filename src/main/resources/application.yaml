spring:
    application:
        name: SetupShop

    datasource:
        url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
        username: ${POSTGRES_USER}
        password: ${POSTGRES_PASSWORD}

    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate

    flyway:
        enabled: true
        locations: classpath:db/migration

    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${AUTH0_ISSUER_URI}
                    audiences: ${AUTH0_AUDIENCE}
